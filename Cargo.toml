[package]
name = "dbgt"
version = "0.1.0"
edition = "2021"
description = "TUI debugger: GEF-style dashboard + r2-style CFG (Linux x86_64)"

[dependencies]
ratatui = "0.29"
nix = { version = "0.29", features = ["ptrace", "process", "signal", "personality", "term"] }
iced-x86 = "1.21"
object = "0.36"
gimli = "0.31"
vt100 = "0.15"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
